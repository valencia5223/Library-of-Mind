<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Library of Mind - 나만의 3D 비주얼 책장관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="description" content="나만의 3D 책장, 실시간 도서 검색, 생각 저장소, 백색소음 몰입 스튜디오" />
    <meta name="theme-color" content="#f7f7f8" />
    <!-- 저장된 테마를 첫 화면 전에 적용 (깜빡임 방지, src/utils/theme.js 와 같은 키) -->
    <script>
      try {
        var t = localStorage.getItem('lom_theme');
        if (['paper', 'gallery', 'lavender'].indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
