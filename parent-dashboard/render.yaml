# Render 정적 사이트 (Blueprint 로 만들 때 Blueprint Path 를 parent-dashboard/render.yaml 로)
# 주소: https://parent-dashboard.onrender.com (이름이 이미 쓰이고 있으면 Render 가 뒤에 글자를 붙임)
services:
  - type: web
    name: parent-dashboard
    runtime: static
    rootDir: parent-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
